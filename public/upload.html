<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Upload Produk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --primary: #4e73df;
      --bg: #f5f6fa;
      --card: #ffffff;
      --text: #2f3640;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      padding: 30px;
      color: var(--text);
    }

    /* Card Animation */
    .card {
      background: var(--card);
      padding: 24px;
      max-width: 440px;
      margin: auto;
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0,0,0,.1);
      animation: fadeUp .6s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      margin-bottom: 10px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      margin-top: 12px;
      display: block;
    }

    input, textarea {
      width: 100%;
      margin-top: 6px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #dcdde1;
      transition: border .2s, box-shadow .2s;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(78,115,223,.15);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    /* Upload Area */
    .upload-box {
      margin-top: 15px;
      padding: 18px;
      border: 2px dashed #dcdde1;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      transition: all .25s ease;
    }

    .upload-box:hover {
      border-color: var(--primary);
      background: rgba(78,115,223,.05);
    }

    .upload-box span {
      font-size: 13px;
      color: #718093;
    }

    input[type="file"] {
      display: none;
    }

    /* Preview */
    #preview {
      margin-top: 15px;
      animation: fadeIn .4s ease;
    }

    #preview img,
    #preview video {
      width: 100%;
      border-radius: 10px;
      background: #000;
      animation: zoomIn .4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0 }
      to { opacity: 1 }
    }

    @keyframes zoomIn {
      from { transform: scale(.95) }
      to { transform: scale(1) }
    }

    /* Button */
    button {
      margin-top: 18px;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(78,115,223,.35);
    }

    button:disabled {
      background: #a4b0be;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    /* Loading */
    .loading {
      opacity: .7;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Upload Produk</h2>

  <form id="uploadForm" enctype="multipart/form-data">
    <label>Nama Produk</label>
    <input type="text" name="name" required>

    <label>Harga</label>
    <input type="number" name="price" required>

    <label>Deskripsi</label>
    <textarea name="description"></textarea>

    <label>Media Produk</label>
    <div class="upload-box" onclick="document.getElementById('mediaInput').click()">
      <span>Klik untuk pilih gambar / video</span>
    </div>

    <input
      type="file"
      name="media"
      id="mediaInput"
      accept="image/*,video/*"
      required
    >

    <div id="preview"></div>

    <button type="submit" id="submitBtn">Upload Produk</button>
  </form>
</div>

<script src="/js/api.js"></script>
<script src="/js/tab.js"></script>
<script>
const mediaInput = document.getElementById('mediaInput')
const preview = document.getElementById('preview')
const form = document.getElementById('uploadForm')
const btn = document.getElementById('submitBtn')

mediaInput.addEventListener('change', () => {
  preview.innerHTML = ''
  const file = mediaInput.files[0]
  if (!file) return

  const url = URL.createObjectURL(file)

  if (file.type.startsWith('video/')) {
    const video = document.createElement('video')
    video.src = url
    video.controls = true
    video.muted = true
    preview.appendChild(video)
  } else {
    const img = document.createElement('img')
    img.src = url
    preview.appendChild(img)
  }
})

form.addEventListener('submit', async e => {
  e.preventDefault()

  btn.disabled = true
  btn.textContent = 'Uploading...'
  form.classList.add('loading')

  const formData = new FormData(form)

  try {
    const res = await apiFetch('/admin/items', {
      method: 'POST',
      body: formData
    })

    const result = await res.json()

    if (result.success) {
      alert('Produk berhasil diupload 🎉')
      form.reset()
      preview.innerHTML = ''
    } else {
      alert('Upload gagal')
    }
  } catch (err) {
    alert('Server error')
  }

  btn.disabled = false
  btn.textContent = 'Upload Produk'
  form.classList.remove('loading')
})
</script>

</body>
</html>
