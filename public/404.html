<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Halaman Tidak Ditemukan</title>

<link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Righteous',cursive;
  background:radial-gradient(circle at bottom,#0f172a,#020617);
  height:100vh;
  overflow:hidden;
  color:white;
}

/* ===== SCENE ===== */
.scene{
  position:relative;
  width:100%;
  height:100%;
}

/* ===== MOON ===== */
.moon{
  position:absolute;
  top:10%;
  left:8%;
  width:180px;
  height:180px;
  border-radius:50%;
  background:#e5e7eb;
  box-shadow:0 0 40px rgba(255,255,255,.25);
  animation:moonFloat 8s ease-in-out infinite;
}
.moon::before,
.moon::after{
  content:'';
  position:absolute;
  border-radius:50%;
  background:#d1d5db;
}
.moon::before{width:30px;height:30px;top:40px;left:50px}
.moon::after{width:20px;height:20px;top:90px;left:90px}

@keyframes moonFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}

/* ===== STARS ===== */
.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  border-radius:50%;
  animation:twinkle 2s infinite alternate;
}
.star:nth-child(1){top:20%;left:70%}
.star:nth-child(2){top:30%;left:40%}
.star:nth-child(3){top:10%;left:85%}
.star:nth-child(4){top:55%;left:65%}
.star:nth-child(5){top:75%;left:35%}
.star:nth-child(6){top:60%;left:80%}
.star:nth-child(7){top:45%;left:25%}

@keyframes twinkle{
  from{opacity:.2;transform:scale(.8)}
  to{opacity:1;transform:scale(1.5)}
}

/* ===== CONTENT ===== */
.content{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.error{
  max-width:420px;
  animation:slideIn .9s ease forwards;
}

@keyframes slideIn{
  from{opacity:0;transform:translateY(40px)}
  to{opacity:1;transform:translateY(0)}
}

.error h1{
  font-size:6rem;
  background:linear-gradient(135deg,#6366f1,#22c55e);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.error h2{
  margin:10px 0;
  font-size:1.2rem;
}

.error p{
  color:#9ca3af;
  margin-bottom:20px;
}

.buttons{
  display:flex;
  gap:12px;
}

button{
  padding:10px 16px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
  background:#1e293b;
  color:white;
  transition:.25s;
}

button.primary{
  background:#4f46e5;
}

button:hover{
  transform:translateY(-3px);
}

/* ===== ASTRONAUT ===== */
.astronaut{
  position:absolute;
  right:10%;
  bottom:15%;
  width:120px;
  animation:
    float 4s ease-in-out infinite,
    spin 14s linear infinite;
  transform-origin:center;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-20px)}
}

@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

.head{
  width:70px;
  height:70px;
  background:#c7d2fe;
  border-radius:50%;
  border:4px solid #e5e7eb;
  margin:auto;
}

.body{
  width:80px;
  height:100px;
  background:#e5e7eb;
  border-radius:20px;
  margin:-10px auto 0;
}

/* RESPONSIVE */
@media(max-width:768px){
  .astronaut{display:none}
  .error{text-align:center}
}
</style>
</head>

<body>

<div class="scene">
  <div class="moon"></div>

  <div class="star"></div>
  <div class="star"></div>
  <div class="star"></div>
  <div class="star"></div>
  <div class="star"></div>
  <div class="star"></div>
  <div class="star"></div>

  <div class="content">
    <div class="error">
      <h1>404</h1>
      <h2>Halaman Tidak Ditemukan</h2>
      <p>Kamu terlalu jauh menjelajah angkasa 🚀</p>

      <div class="buttons">
        <button class="primary" onclick="goHome()">🏠 Beranda</button>
        <button onclick="goDashboard()">📦 Dashboard</button>
      </div>
    </div>

    <div class="astronaut">
      <div class="head"></div>
      <div class="body"></div>
    </div>
  </div>
</div>

<script>
/* ===== BUTTON ===== */
function goHome(){
  location.href='/';
}
function goDashboard(){
  location.href='/dashboard';
}

/* ===== PARALLAX ===== */
const astro = document.querySelector('.astronaut');
const moon = document.querySelector('.moon');

document.addEventListener('mousemove',e=>{
  const x=(e.clientX/window.innerWidth-.5)*20;
  const y=(e.clientY/window.innerHeight-.5)*20;

  astro.style.transform =
    `translate(${x}px,${y}px) rotate(${x}deg)`;
  moon.style.transform =
    `translate(${x/2}px,${y/2}px)`;
});
</script>

</body>
</html>
